name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pkg repo
        uses: actions/checkout@v4

      - name: Checkout quattro-on-zfs
        uses: actions/checkout@v4
        with:
          repository: berenddeboer/omarchy
          ref: quattro-on-zfs
          path: omarchy
          fetch-depth: 0

      - name: Fetch upstream version tags
        run: git -C omarchy fetch --tags https://github.com/basecamp/omarchy.git

      - name: Build packages
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD:/work" \
            -w /work \
            archlinux:base-devel \
            bash /work/script/build.sh

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete zfs --cleanup-tag --yes || true
          gh release create zfs \
            --title "Omarchy ZFS packages" \
            --notes "Rolling pacman repo built from berenddeboer/omarchy@quattro-on-zfs." \
            x86_64/*
